#####################################################################
#   Macros
#####################################################################

#######################################################
##                   Filament Macro
#######################################################
[gcode_macro LOAD_FILAMENT]
description: Heat and load filament slowly, then purge
# Optional: TEMP= (default 230), PURGE= (mm, default 40)
gcode:
  {% set T = params.TEMP|default(230)|int %}
  {% set P = params.PURGE|default(40)|float %}
  M117 Heating to {T}C
  M109 S{T}
  M83
  G92 E0
  G1 E15 F300         ; preload
  G1 E35 F120         ; slow feed into hotend
  G1 E{P} F300        ; purge
  G92 E0
  M82
  M117 Loaded

[gcode_macro UNLOAD_FILAMENT]
description: Heat and retract to clear hotend and gears
# Optional: TEMP= (default 230), RETRACT= (mm, default 35)
gcode:
  {% set T = params.TEMP|default(230)|int %}
  {% set R = params.RETRACT|default(35)|float %}
  M117 Heating to {T}C
  M109 S{T}
  M83
  G92 E0
  G1 E5 F240           ; soften tip
  G4 P500
  G1 E-{R} F1800       ; brisk pullback
  G92 E0
  M82
  M117 Unloaded

[gcode_macro M600]
description: Filament change: pause, park, unload; resume to continue
gcode:
  {% set T = params.TEMP|default(printer.extruder.target|int if printer.extruder.target > 0 else 230)|int %}
  M117 Filament change…
  PAUSE
  UNLOAD_FILAMENT TEMP={T}
  ; Load new filament manually, then:
  M117 After loading, run: LOAD_FILAMENT TEMP={T} and RESUME
  
#######################################################
##                   Prime line
#######################################################

[gcode_macro DRAW_LINES]
description: Two prime lines along the front edge on a 300x300 bed
# Optional params: Z=0.28, E1=17, E2=34
gcode:
  {% set z = params.Z|default(0.28)|float %}
  {% set e1 = params.E1|default(17)|float %}
  {% set e2 = params.E2|default(34)|float %}

  G90
  M83
  G1 X5 Y5 F9000          ; front-left margin
  G1 Z{z} F6000
  G1 E10 F400             ; pre-prime a bit
  G1 X295 Y5  F1200 E{e1} ; first line across front
  G1 X295 Y6  F3000       ; hop sideways 1 mm
  G1 X10  Y6  F1200 E{e2} ; second line back
  G92 E0
  M82
  
#######################################################
##                   PRINT START (Trident + TAP
#######################################################

[gcode_macro PRINT_START]
description: Heat → Z-tilt → clean → mesh → heat nozzle → prime → go
# Accepts: BED=, EXTRUDER=, SOAK=<min>, MESH=1/0, USE_SAVED_MESH=""
gcode:
  PREFLIGHT_CHECK
  {% set BED = params.BED|default(60)|int %}
  {% set HOTEND = params.EXTRUDER|default(210)|int %}
  {% set SOAK = params.SOAK|default(0)|int %}
  {% set DO_MESH = (params.MESH|default(1)|int) %}
  {% set SAVED = params.USE_SAVED_MESH|default("") %}
  {% set CX = printer.toolhead.axis_maximum.x/2.0 %}
  {% set CY = printer.toolhead.axis_maximum.y/2.0 %}

  SET_GCODE_OFFSET Z=0
  M117 Heating bed…
  M140 S{BED}
  M104 S150                        ; ooze-safe for TAP & cleaning

  G28                              ; home cool for TAP accuracy
  G90
  G1 X{CX} Y{CY} Z15 F12000
  M190 S{BED}                      ; wait for bed

  {% if SOAK > 0 %}
    M117 Soaking {SOAK} min…
    G4 P{SOAK*60000}
  {% endif %}

  ; Clean the nozzle BEFORE probing (at 150 C)
  M117 Nozzle clean…
  G1 X20 Y8 Z0.6 F12000
  NOZZLE_CLEAN PASSES=8
  
  M117 Z Tilt Adjust
  Z_TILT_ADJUST
  G28 Z

  ; Mesh (or load a saved profile)
  BED_MESH_CLEAR
  M117 Loading mesh...
  BED_MESH_PROFILE LOAD=default100

  ; Final hotend heat for printing
  M117 Heating nozzle…
  G1 X{CX} Y{CY} Z15 F12000
  M109 S{HOTEND}
  SKEW_PROFILE LOAD=Califlower

  ; Prime lines at front
  M117 Prime lines…
  DRAW_LINES
  M117 Printing…
  
#######################################################
##                   PRINT END
#######################################################

[gcode_macro PRINT_END]
description: Park, cool, fans off, clear mesh
gcode:
  SET_SKEW CLEAR=1
  {% set th = printer.toolhead %}
  {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
  {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
  {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

  SAVE_GCODE_STATE NAME=STATE_PRINT_END
  M400
  G92 E0
  G1 E-20 F3600

  TURN_OFF_HEATERS

  G90
  G0 X{x_safe} Y{y_safe} Z{z_safe} F20000
  G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F6000  ; rear-center park
  M107                                      ; turns off [fan]
  SET_FAN_SPEED FAN=BedFans SPEED=0            ; aux blower

  BED_MESH_CLEAR
  RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0  

#######################################################
##                   PAUSE / RESUME
#######################################################  

[gcode_macro PAUSE]
description: Pause the print and park safely
rename_existing: PAUSE_BASE
variable_extrude: 1.0
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 2.0 if act_z < (max_z - 2.0) else (max_z - act_z) %}
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

[gcode_macro RESUME]
description: Resume the paused print
rename_existing: RESUME_BASE
gcode:
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {% else %}
    {% set get_params = "" %}
  {% endif %}
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

#######################################################
##                   CANCEL
#######################################################  


[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
variable_park: True
gcode:
  G28 Y
  _TOOLHEAD_PARK_PAUSE_CANCEL
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  M107

